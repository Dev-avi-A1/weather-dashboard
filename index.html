<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Dashboard</title>
    <meta
      name="description"
      content="A modern weather dashboard built with vanilla HTML, CSS, and JavaScript using the Open-Meteo API."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Weather Overview</p>
          <h1>Weather Dashboard</h1>
        </div>
        <button id="locationBtn" class="secondary-btn" type="button">
          Use my location
        </button>
      </header>

      <section class="search-panel">
        <form id="searchForm" class="search-form">
          <label class="sr-only" for="cityInput">Search city</label>
          <input
            id="cityInput"
            type="text"
            name="city"
            placeholder="Search for a city..."
            autocomplete="off"
          />
          <button type="submit">Search</button>
        </form>

        <div id="savedCities" class="saved-cities" aria-live="polite"></div>
      </section>

      <main class="dashboard">
        <section id="currentWeather" class="weather-card current-card">
          <div class="card-header">
            <div>
              <p class="card-label">Current weather</p>
              <h2 id="locationName">Loading...</h2>
            </div>
            <span id="weatherIcon" class="weather-icon" aria-label="Weather condition">
              ☀️
            </span>
          </div>

          <div class="temp-row">
            <div class="temp" id="currentTemp">--°C</div>
            <div class="summary"> 
              <div id="currentSummary">Fetching weather...</div>
              <div id="feelsLike">Feels like --°C</div>
            </div>
          </div>

          <div class="detail-grid">
            <div class="detail-item">
              <span class="detail-label">Humidity</span>
              <strong id="humidity">--%</strong>
            </div>
            <div class="detail-item">
              <span class="detail-label">Wind</span>
              <strong id="windSpeed">-- km/h</strong>
            </div>
            <div class="detail-item">
              <span class="detail-label">Precipitation</span>
              <strong id="precipitation">-- mm</strong>
            </div>
            <div class="detail-item">
              <span class="detail-label">Sunrise</span>
              <strong id="sunrise">--:--</strong>
            </div>
          </div>
        </section>

        <section class="weather-card">
          <div class="card-header">
            <div>
              <p class="card-label">Next 6 hours</p>
              <h3>Hourly forecast</h3>
            </div>
          </div>
          <div id="hourlyForecast" class="hourly-forecast"></div>
        </section>

        <section class="weather-card">
          <div class="card-header">
            <div>
              <p class="card-label">Week outlook</p>
              <h3>7-day forecast</h3>
            </div>
          </div>
          <div id="dailyForecast" class="daily-forecast"></div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="script.js"></script>
  </body>
</html>
